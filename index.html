<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<title>Eesti filmid</title>
<style>
  :root {
    --bg: #0d1b2a;
    --card-bg: #1b2838;
    --accent: #01b4e4;
    --text: #e0e6ed;
    --muted: #8a9bb0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  main {
    width: 100%;
    max-width: 420px;
    padding: 20px;
  }
  h1 {
    text-align: center;
    font-size: 1.5rem;
    margin: 0 0 24px;
  }
  .links {
    display: grid;
    gap: 12px;
  }
  .links a {
    display: block;
    background: var(--card-bg);
    color: var(--text);
    text-decoration: none;
    padding: 16px 20px;
    border-radius: 8px;
    font-size: 1.1rem;
    font-weight: 600;
    text-align: center;
    transition: transform 0.15s ease;
  }
  .links a:hover {
    transform: translateY(-4px);
  }
</style>
</head>
<body>
<main>
  <h1>Eesti filmid</h1>
  <div class="links">
    <a href="web/filmid.html">Filmid</a>
    <a href="web/multikad.html">Multikad</a>
  </div>
</main>
</body>
</html>
