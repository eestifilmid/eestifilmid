<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<title>Multikad</title>
<style>
  :root {
    --bg: #0d1b2a;
    --card-bg: #1b2838;
    --accent: #01b4e4;
    --text: #e0e6ed;
    --muted: #8a9bb0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(13, 27, 42, 0.95);
    backdrop-filter: blur(6px);
    padding: 16px 20px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  h1 {
    margin: 0;
    font-size: 1.3rem;
    font-weight: 600;
  }
  #count {
    color: var(--muted);
    font-size: 0.9rem;
    white-space: nowrap;
  }
  #search {
    flex: 1;
    max-width: 320px;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: #11212f;
    color: var(--text);
    font-size: 0.95rem;
  }
  #search:focus {
    outline: 2px solid var(--accent);
  }
  main {
    padding: 20px;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--card-bg);
    border-radius: 8px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 100%;
    transition: transform 0.15s ease;
  }
  .card:hover {
    transform: translateY(-4px);
  }
  .poster-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 2 / 3;
    background: #11212f;
  }
  .poster-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .poster-wrap img.loaded {
    opacity: 1;
  }
  .poster-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .poster-placeholder.hidden {
    display: none;
  }
  .info {
    padding: 8px 10px 12px;
  }
  .title-et {
    font-size: 0.9rem;
    font-weight: 600;
    line-height: 1.25;
    margin: 0 0 2px;
  }
  .meta {
    font-size: 0.78rem;
    color: var(--muted);
    margin: 0;
  }
  #status {
    color: var(--muted);
    padding: 40px;
    text-align: center;
  }
  .card-wrap {
    position: relative;
    height: 100%;
  }
  .card-wrap.hidden {
    display: none;
  }
  .card-link {
    display: block;
    height: 100%;
    text-decoration: none;
    color: inherit;
  }
  .icon-links {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 2;
    display: flex;
    gap: 6px;
  }
  .icon-links a {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
  }
  .icon-links img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  footer {
    padding: 24px 20px 40px;
    text-align: center;
    font-size: 0.85rem;
    color: var(--muted);
  }
  footer a {
    color: var(--accent);
    text-decoration: none;
  }
  footer a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
<header>
  <h1>Multikad</h1>
  <input type="search" id="search" placeholder="Otsi pealkirja jargi...">
  <span id="count"></span>
</header>
<main>
  <div id="status"></div>
  <div id="grid"></div>
</main>
<footer>
  Andmed pärinevad avatud lähtekoodiga projektist
  <a href="https://github.com/eestifilmid/eestifilmid" target="_blank" rel="noopener noreferrer">eestifilmid/eestifilmid</a>
</footer>
<script>
  const DATA_URL = "https://raw.githubusercontent.com/eestifilmid/eestifilmid/refs/heads/main/multikad.txt";
  const LINE_RE = /^(.*?)\s*\((\d{4})\)\s*\[(.*?)\]\s*\{tmdb-(\d+)\}\s*$/;

  const grid = document.getElementById("grid");
  const status = document.getElementById("status");
  const search = document.getElementById("search");
  const count = document.getElementById("count");

  let totalMovies = 0;

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function parseLines(text) {
    const movies = [];
    for (const line of text.split(/\r?\n/)) {
      const trimmed = line.trim();
      if (!trimmed) continue;
      const m = trimmed.match(LINE_RE);
      if (!m) continue;
      movies.push({
        estonianTitle: m[1].trim(),
        year: m[2],
        englishTitle: m[3].trim(),
        tmdbId: m[4],
      });
    }
    return movies;
  }

  function elisaSearchUrl(title) {
    return "https://elisaelamus.ee/search?term=" + encodeURIComponent(title).replace(/%20/g, "+");
  }

  function go3SearchUrl(title) {
    return "https://go3.ee/search?query=" + encodeURIComponent(title).replace(/%20/g, "+");
  }

  function teliaSearchUrl(title) {
    return "https://www.teliatv.ee/otsing/" + encodeURIComponent(title);
  }

  function createCard(movie) {
    const wrap = document.createElement("div");
    wrap.className = "card-wrap";

    const searchText = (movie.estonianTitle + " " + movie.englishTitle).toLowerCase();

    wrap.innerHTML = `
      <a class="card-link" href="https://www.themoviedb.org/movie/${movie.tmdbId}" target="_blank" rel="noopener noreferrer">
        <div class="card" data-search="${escapeHtml(searchText)}">
          <div class="poster-wrap">
            <div class="poster-placeholder">${escapeHtml(movie.estonianTitle)}</div>
            <img src="posters/${movie.tmdbId}.jpg" alt="${escapeHtml(movie.estonianTitle)}" loading="lazy">
          </div>
          <div class="info">
            <p class="title-et">${escapeHtml(movie.estonianTitle)}</p>
            <p class="meta">${escapeHtml(movie.englishTitle)} (${movie.year})</p>
          </div>
        </div>
      </a>
      <div class="icon-links">
        <a href="${elisaSearchUrl(movie.estonianTitle)}" target="_blank" rel="noopener noreferrer" title="Otsi Elisa Elamust">
          <img src="elisa.jpg" alt="Elisa Elamus">
        </a>
        <a href="${go3SearchUrl(movie.estonianTitle)}" target="_blank" rel="noopener noreferrer" title="Otsi Go3-st">
          <img src="go3.jpg" alt="Go3">
        </a>
        <a href="${teliaSearchUrl(movie.estonianTitle)}" target="_blank" rel="noopener noreferrer" title="Otsi Telia TV-st">
          <img src="telia.jpg" alt="Telia TV">
        </a>
      </div>
    `;

    const img = wrap.querySelector(".poster-wrap img");
    const placeholder = wrap.querySelector(".poster-placeholder");
    img.addEventListener("load", () => {
      img.classList.add("loaded");
      placeholder.classList.add("hidden");
    });
    img.addEventListener("error", () => {
      img.remove();
    });

    return wrap;
  }

  function updateCount() {
    const visible = grid.querySelectorAll(".card-wrap:not(.hidden)").length;
    count.textContent = visible === totalMovies
      ? `${totalMovies} multikat`
      : `${visible} / ${totalMovies} multikat`;
  }

  async function init() {
    let text;
    try {
      const res = await fetch(DATA_URL);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      text = await res.text();
    } catch (e) {
      status.textContent = "Andmete laadimine ebaõnnestus: " + e.message;
      return;
    }

    const movies = parseLines(text);
    totalMovies = movies.length;
    status.classList.add("hidden");

    for (const movie of movies) {
      const wrap = createCard(movie);
      grid.appendChild(wrap);
    }

    updateCount();
  }

  search.addEventListener("input", () => {
    const q = search.value.trim().toLowerCase();
    for (const wrap of grid.querySelectorAll(".card-wrap")) {
      const matches = !q || wrap.querySelector(".card").dataset.search.includes(q);
      wrap.classList.toggle("hidden", !matches);
    }
    updateCount();
  });

  init();
</script>
</body>
</html>
